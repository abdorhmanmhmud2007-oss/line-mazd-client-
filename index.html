<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Line Mazd</title>
  <!-- أيقونة الموقع (اللوجو الحقيقي) -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://alphhjktqdoubsaxjrgm.supabase.co/storage/v1/object/public/receipts/IMG_6547.png">
  <link rel="icon" type="image/png" href="https://alphhjktqdoubsaxjrgm.supabase.co/storage/v1/object/public/receipts/IMG_6547.png">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      background-image: url('https://alphhjktqdoubsaxjrgm.supabase.co/storage/v1/object/public/receipts/IMG_6653.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-color: #0f172a; 
      color: #fff; 
      font-family: system-ui, -apple-system, sans-serif; 
    }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 12px; background-color: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 6px; }
    .card { background-color: rgba(30, 41, 59, 0.9); backdrop-filter: blur(5px); border: 1px solid #334155; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; }
    .card:hover { border-color: #38bdf8; }
    .modal { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; padding: 15px; z-index: 1000; }
    .modal-content { background: #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .status-pending { background-color: #f59e0b; color: #000; }
    .status-completed { background-color: #16a34a; color: #fff; }
    .status-rejected { background-color: #dc2626; color: #fff; }
    .game-icon { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; }
    .whatsapp-btn {
      width: 45px;
      height: 45px;
      background-color: #25D366;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.2s;
    }
    .whatsapp-btn:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createClient } = supabase;

    const supabaseUrl = 'https://alphhjktqdoubsaxjrgm.supabase.co';
    const supabaseKey = 'sb_publishable_Yyzx9XadPI-ucUkpppQNEg_PGGWqWxx';
    const db = createClient(supabaseUrl, supabaseKey);

    const GAMES = [
      { id: 'freefire', name: 'Free Fire', img: 'https://alphhjktqdoubsaxjrgm.supabase.co/storage/v1/object/public/receipts/IMG_6643.jpeg' },
      { id: 'pubg', name: 'PUBG Mobile', img: 'https://alphhjktqdoubsaxjrgm.supabase.co/storage/v1/object/public/receipts/IMG_6644.jpeg' },
      { id: 'itunes', name: 'iTunes Gift Card USA', img: 'https://alphhjktqdoubsaxjrgm.supabase.co/storage/v1/object/public/receipts/IMG_6646.jpeg' },
      { id: 'usdt', name: 'Binance USDT', img: 'https://alphhjktqdoubsaxjrgm.supabase.co/storage/v1/object/public/receipts/IMG_6649.jpeg' },
      { id: 'roblox', name: 'Roblox USA', img: 'https://alphhjktqdoubsaxjrgm.supabase.co/storage/v1/object/public/receipts/IMG_6650.jpeg' },
      { id: 'razer', name: 'Razer Gold Global', img: 'https://alphhjktqdoubsaxjrgm.supabase.co/storage/v1/object/public/receipts/IMG_6651.jpeg' }
    ];

    function App() {
      const [products, setProducts] = useState([]);
      const [selectedGame, setSelectedGame] = useState(null);
      const [selectedOffer, setSelectedOffer] = useState(null);
      
      // عناصر طلب الشحن
      const [paymentMethod, setPaymentMethod] = useState('transfer');
      const [playerId, setPlayerId] = useState('');
      const [senderPhone, setSenderPhone] = useState('');
      const [cardCode, setCardCode] = useState('');
      const [imageFile, setImageFile] = useState(null);

      // البلاغات واستلام الأكواد ومتابعة حالة الطلبات
      const [showReport, setShowReport] = useState(false);
      const [reportPhone, setReportPhone] = useState('');
      const [reportMsg, setReportMsg] = useState('');
      
      const [showCheckCode, setShowCheckCode] = useState(false);
      const [searchPhone, setSearchPhone] = useState('');
      const [retrievedCode, setRetrievedCode] = useState(null);

      const [showOrderStatus, setShowOrderStatus] = useState(false);
      const [statusQuery, setStatusQuery] = useState('');
      const [orderStatusResults, setOrderStatusResults] = useState(null);

      const [loading, setLoading] = useState(false);

      useEffect(() => {
        // تسجيل الزائر
        db.from('visitors').insert([{ user_agent: navigator.userAgent }]).then(() => {});

        // جلب المنتجات
        async function fetchProducts() {
          const { data } = await db.from('products').select('*');
          if (data) setProducts(data);
        }
        fetchProducts();
      }, []);

      // رفع الصورة
      async function uploadImage(file) {
        if (!file) return null;
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}.${fileExt}`;
        const { data, error } = await db.storage.from('receipts').upload(fileName, file);
        if (error) return null;
        const { data: publicUrlData } = db.storage.from('receipts').getPublicUrl(fileName);
        return publicUrlData.publicUrl;
      }

      async function handleOrder(e) {
        e.preventDefault();
        setLoading(true);

        let imgUrl = null;
        if (imageFile) {
          imgUrl = await uploadImage(imageFile);
        }

        let isCodeService = ['itunes', 'usdt', 'roblox', 'razer'].includes(selectedGame);

        let order = {
          product_name: selectedOffer.name,
          price: selectedOffer.price,
          player_id: isCodeService ? `${GAMES.find(g => g.id === selectedGame)?.name} (تسليم كود)` : playerId,
          payment_method: paymentMethod === 'transfer' ? 'تحويل رصيد ليبيانا' : 'كتابة الكرت',
          receipt_url: imgUrl,
          status: 'pending'
        };

        if (paymentMethod === 'transfer') {
          order.sender_phone = senderPhone;
        } else {
          order.card_code = cardCode;
          order.sender_phone = senderPhone;
        }

        const { error } = await db.from('orders').insert([order]);
        setLoading(false);

        if (error) {
          alert('حدث خطأ في الإرسال: ' + error.message);
        } else {
          alert('تم إرسال الطلب بنجاح! يمكنك متابعة حالته في أي وقت بزيارة زر "متابعة حالة الطلب".');
          setSelectedOffer(null);
          setPlayerId('');
          setSenderPhone('');
          setCardCode('');
          setImageFile(null);
        }
      }

      async function handleReport(e) {
        e.preventDefault();
        setLoading(true);
        const { error } = await db.from('reports').insert([{ user_phone: reportPhone, message: reportMsg }]);
        setLoading(false);
        if (error) alert('خطأ: ' + error.message);
        else {
          alert('تم إرسال البلاغ إلى الإدارة بنجاح');
          setShowReport(false);
          setReportPhone('');
          setReportMsg('');
        }
      }

      async function handleCheckCode(e) {
        e.preventDefault();
        setLoading(true);
        const { data, error } = await db.from('orders').select('*').eq('sender_phone', searchPhone).not('digital_code', 'is', null);
        setLoading(false);
        if (data && data.length > 0) {
          setRetrievedCode(data);
        } else {
          alert('لم يتم العثور على أرقام/أكواد تسليم جهزت لهذا الرقم بعد.');
        }
      }

      async function handleCheckOrderStatus(e) {
        e.preventDefault();
        setLoading(true);
        const { data, error } = await db.from('orders')
          .select('*')
          .or(`sender_phone.eq.${statusQuery},player_id.eq.${statusQuery}`)
          .order('created_at', { ascending: false });

        setLoading(false);

        if (data && data.length > 0) {
          setOrderStatusResults(data);
        } else {
          alert('لم يتم العثور على أي طلب مرتبط بهذا الرقم أو الآيدي.');
          setOrderStatusResults([]);
        }
      }

      // دالة مساعدة لتصفية المنتجات حسب اللعبة أو الخدمة المختارة
      function getFilteredProducts() {
        if (!selectedGame) return [];
        return products.filter(p => {
          if (p.category === selectedGame) return true;
          if (selectedGame === 'freefire' && p.name.includes('Free Fire')) return true;
          if (selectedGame === 'pubg' && p.name.includes('PUBG')) return true;
          if (selectedGame === 'itunes' && (p.name.includes('iTunes') || p.name.includes('آيتونز'))) return true;
          if (selectedGame === 'usdt' && (p.name.includes('USDT') || p.name.includes('بينانس'))) return true;
          if (selectedGame === 'roblox' && (p.name.includes('Roblox') || p.name.includes('روبلوكس'))) return true;
          if (selectedGame === 'razer' && (p.name.includes('Razer') || p.name.includes('ريزر'))) return true;
          return false;
        });
      }

      // العروض الافتراضية الثابتة في حال لم تكن مسجلة في قاعدة البيانات أو لضمان ظهورها فوراً
      function getStaticOffers() {
        if (selectedGame === 'usdt') {
          return [
            { id: 'u1', name: 'USDT 5$', price: 5, category: 'usdt' },
            { id: 'u2', name: 'USDT 10$', price: 10, category: 'usdt' },
            { id: 'u3', name: 'USDT 15$', price: 15, category: 'usdt' },
            { id: 'u4', name: 'USDT 25$', price: 25, category: 'usdt' },
            { id: 'u5', name: 'USDT 50$', price: 50, category: 'usdt' }
          ];
        }
        if (selectedGame === 'roblox') {
          return [
            { id: 'r1', name: 'Roblox 10$', price: 10, category: 'roblox' },
            { id: 'r2', name: 'Roblox 15$', price: 15, category: 'roblox' },
            { id: 'r3', name: 'Roblox 25$', price: 25, category: 'roblox' },
            { id: 'r4', name: 'Roblox 30$', price: 30, category: 'roblox' }
          ];
        }
        if (selectedGame === 'razer') {
          return [
            { id: 'rz1', name: 'Razer Gold 1$', price: 1, category: 'razer' },
            { id: 'rz2', name: 'Razer Gold 2$', price: 2, category: 'razer' },
            { id: 'rz3', name: 'Razer Gold 5$', price: 5, category: 'razer' },
            { id: 'rz4', name: 'Razer Gold 10$', price: 10, category: 'razer' },
            { id: 'rz5', name: 'Razer Gold 20$', price: 20, category: 'razer' }
          ];
        }
        return [];
      }

      return (
        <div style={{ padding: '15px', maxWidth: '500px', margin: '0 auto', backgroundColor: 'rgba(15, 23, 42, 0.85)', minHeight: '100vh', borderRadius: '12px' }}>
          {/* Header */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid #1e293b', paddingBottom: '15px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
              <img src="https://alphhjktqdoubsaxjrgm.supabase.co/storage/v1/object/public/receipts/IMG_6547.png" alt="Line Mazd Logo" style={{ width: '40px', height: '40px', objectFit: 'cover', borderRadius: '50%' }} />
              <h2 style={{ margin: 0, fontSize: '20px', color: '#38bdf8' }}>Line Mazd</h2>
            </div>
            <a href="https://wa.me/218913147002" target="_blank" className="whatsapp-btn" title="واتساب الدعم">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.124-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
              </svg>
            </a>
          </div>

          {/* أزرار الخدمات العلويّة */}
          <div style={{ display: 'flex', gap: '8px', marginTop: '15px', flexWrap: 'wrap' }}>
            <button onClick={() => setShowOrderStatus(true)} style={{ flex: '1 1 100%', backgroundColor: '#f59e0b', color: '#000', border: 'none', padding: '10px', borderRadius: '6px', cursor: 'pointer', fontWeight: 'bold', fontSize: '14px' }}>
              🔍 متابعة حالة الطلب
            </button>
            <button onClick={() => setShowCheckCode(true)} style={{ flex: 1, backgroundColor: '#0284c7', color: '#fff', border: 'none', padding: '8px', borderRadius: '6px', cursor: 'pointer', fontWeight: 'bold', fontSize: '13px' }}>
              🔑 استلام الأكواد
            </button>
            <button onClick={() => setShowReport(true)} style={{ flex: 1, backgroundColor: '#dc2626', color: '#fff', border: 'none', padding: '8px', borderRadius: '6px', cursor: 'pointer', fontWeight: 'bold', fontSize: '13px' }}>
              ⚠️ تقديم بلاغ
            </button>
          </div>

          {/* اختيار الألعاب والخدمات */}
          {!selectedGame && (
            <div>
              <h3 style={{ marginTop: '20px' }}>اختر اللعبة أو الخدمة:</h3>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr', gap: '15px' }}>
                {GAMES.map(g => (
                  <div key={g.id} className="card" onClick={() => setSelectedGame(g.id)} style={{ display: 'flex', alignItems: 'center', justifyContent: 'flex-start', gap: '15px', padding: '16px' }}>
                    <img src={g.img} alt={g.name} className="game-icon" />
                    <h3 style={{ margin: 0, fontSize: '17px' }}>{g.name}</h3>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* عرض باقات اللعبة أو الخدمة المختارة */}
          {selectedGame && (
            <div>
              <button onClick={() => setSelectedGame(null)} style={{ backgroundColor: '#334155', color: '#fff', border: 'none', padding: '6px 12px', borderRadius: '6px', margin: '15px 0', cursor: 'pointer' }}>
                ⬅️ العودة للقائمة
              </button>
              <h3>عروض {GAMES.find(g => g.id === selectedGame)?.name}:</h3>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                {(() => {
                  let filtered = getFilteredProducts();
                  if (filtered.length === 0) {
                    filtered = getStaticOffers();
                  }
                  return filtered.map(p => (
                    <div key={p.id || p.name} className="card" onClick={() => setSelectedOffer(p)}>
                      <h4 style={{ margin: '5px 0' }}>{p.name}</h4>
                      <p style={{ color: '#38bdf8', fontWeight: 'bold', margin: '5px 0' }}>
                        {p.price} {['usdt', 'roblox', 'razer', 'itunes'].includes(selectedGame) ? (selectedGame === 'usdt' ? (() => {
                          const mapPrices = { 5: '75 د.ل', 10: '150 د.ل', 15: '225 د.ل', 25: '375 د.ل', 50: '745 د.ل' };
                          return mapPrices[p.price] || `${p.price} د.ل`;
                        })() : selectedGame === 'roblox' ? (() => {
                          const mapRoblox = { 10: '140 د', 15: '210 د', 25: '340 د', 30: '420 د' };
                          return mapRoblox[p.price] || `${p.price} د`;
                        })() : selectedGame === 'razer' ? (() => {
                          const mapRazer = { 1: '14د', 2: '28د', 5: '70د', 10: '139د', 20: '278د' };
                          return mapRazer[p.price] || `${p.price}د`;
                        })() : `${p.price} د.ل`) : `${p.price} د.ل`}
                      </p>
                    </div>
                  ));
                })()}
              </div>
            </div>
          )}

          {/* نافذة البيانات وإتمام الدفع */}
          {selectedOffer && (
            <div className="modal">
              <div className="modal-content">
                <h3 style={{ marginTop: 0, color: '#38bdf8' }}>شراء: {selectedOffer.name} ({selectedOffer.price} د.ل)</h3>
                <form onSubmit={handleOrder}>
                  
                  {!['itunes', 'usdt', 'roblox', 'razer'].includes(selectedGame) && (
                    <>
                      <label>ادخل آيدي الحساب (Player ID):</label>
                      <input required value={playerId} onChange={e => setPlayerId(e.target.value)} placeholder="مثال: 12345678" />
                    </>
                  )}

                  <label>طريقة الدفع:</label>
                  <select value={paymentMethod} onChange={e => setPaymentMethod(e.target.value)}>
                    <option value="transfer">تحويل رصيد ليبيانا</option>
                    <option value="card">كتابة الكرت</option>
                  </select>

                  {paymentMethod === 'transfer' ? (
                    <div style={{ backgroundColor: '#0f172a', padding: '10px', borderRadius: '6px', margin: '10px 0', border: '1px solid #334155' }}>
                      <p style={{ margin: '0 0 8px 0', color: '#f59e0b', fontSize: '13px', fontWeight: 'bold' }}>
                        الرجاء التحويل إلى الرقم: <span style={{ color: '#fff', fontSize: '15px' }}>0944235295</span>
                      </p>
                      <label>الرقم الذي حولت منه الرصيد:</label>
                      <input required value={senderPhone} onChange={e => setSenderPhone(e.target.value)} placeholder="09XXXXXXXX" />
                    </div>
                  ) : (
                    <div>
                      <label>أرقام كرت الشحن:</label>
                      <textarea required value={cardCode} onChange={e => setCardCode(e.target.value)} placeholder="اكتب رقم الكرت هنا" />
                      <label>رقم هاتف للتواصل مع الطلب:</label>
                      <input required value={senderPhone} onChange={e => setSenderPhone(e.target.value)} placeholder="09XXXXXXXX" />
                    </div>
                  )}

                  <label>صورة إثبات التحويل / الكرت (الاستوديو):</label>
                  <input type="file" accept="image/*" onChange={e => setImageFile(e.target.files[0])} style={{ padding: '5px' }} />

                  <div style={{ display: 'flex', gap: '10px', marginTop: '15px' }}>
                    <button type="submit" disabled={loading} style={{ flex: 1, backgroundColor: '#16a34a', color: '#fff', border: 'none', padding: '10px', borderRadius: '6px', fontWeight: 'bold' }}>
                      {loading ? 'جاري الإرسال...' : 'تأكيد ودفع'}
                    </button>
                    <button type="button" onClick={() => setSelectedOffer(null)} style={{ backgroundColor: '#64748b', color: '#fff', border: 'none', padding: '10px', borderRadius: '6px' }}>إلغاء</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* نافذة الاستعلام عن حالة الطلب */}
          {showOrderStatus && (
            <div className="modal">
              <div className="modal-content">
                <h3 style={{ color: '#f59e0b', marginTop: 0 }}>🔍 متابعة حالة الطلب</h3>
                <p style={{ fontSize: '12px', color: '#94a3b8' }}>أدخل رقم الهاتف أو الآيدي (Player ID) الذي استخدمته للبحث عن حالة الطلب:</p>
                <form onSubmit={handleCheckOrderStatus}>
                  <input required value={statusQuery} onChange={e => setStatusQuery(e.target.value)} placeholder="رقم الهاتف أو الآيدي" />
                  <button type="submit" disabled={loading} style={{ width: '100%', backgroundColor: '#f59e0b', color: '#000', border: 'none', padding: '10px', borderRadius: '6px', fontWeight: 'bold' }}>
                    {loading ? 'جاري البحث...' : 'بحث عن الطلب'}
                  </button>
                </form>

                {orderStatusResults && (
                  <div style={{ marginTop: '15px', display: 'flex', flexDirection: 'column', gap: '10px' }}>
                    {orderStatusResults.map(item => (
                      <div key={item.id} style={{ backgroundColor: '#0f172a', padding: '10px', borderRadius: '8px', border: '1px solid #334155' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                          <span style={{ fontWeight: 'bold', fontSize: '14px' }}>{item.product_name}</span>
                          {item.status === 'completed' && <span className="badge status-completed">مكتمل ✅</span>}
                          {item.status === 'rejected' && <span className="badge status-rejected">مرفوض ❌</span>}
                          {(!item.status || item.status === 'pending') && <span className="badge status-pending">قيد الانتظار ⏳</span>}
                        </div>
                        <p style={{ margin: '5px 0 0 0', fontSize: '12px', color: '#94a3b8' }}>الآيدي: {item.player_id}</p>
                        {item.digital_code && (
                          <div style={{ marginTop: '8px', padding: '6px', backgroundColor: '#1e293b', borderRadius: '4px', border: '1px solid #16a34a' }}>
                            <p style={{ margin: 0, fontSize: '13px', color: '#22c55e', fontWeight: 'bold' }}>الكود الخاص بك: {item.digital_code}</p>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}

                <button onClick={() => { setShowOrderStatus(false); setOrderStatusResults(null); setStatusQuery(''); }} style={{ width: '100%', backgroundColor: '#64748b', color: '#fff', border: 'none', padding: '8px', borderRadius: '6px', marginTop: '15px' }}>إلغاء</button>
              </div>
            </div>
          )}

          {/* نافذة استلام الكود (الأكواد الرقمية) */}
          {showCheckCode && (
            <div className="modal">
              <div className="modal-content">
                <h3>🔑 استلام الأكواد المشترَاة</h3>
                <p style={{ fontSize: '12px', color: '#94a3b8' }}>أدخل رقم هاتفك الذي استخدمته أثناء التحويل لاستلام الكود المجهز من الأدمن:</p>
                <form onSubmit={handleCheckCode}>
                  <input required value={searchPhone} onChange={e => setSearchPhone(e.target.value)} placeholder="أدخل رقم المحول (09XXXXXXXX)" />
                  <button type="submit" disabled={loading} style={{ width: '100%', backgroundColor: '#0284c7', color: '#fff', border: 'none', padding: '10px', borderRadius: '6px', fontWeight: 'bold' }}>
                    بحث عن الكود
                  </button>
                </form>

                {retrievedCode && (
                  <div style={{ marginTop: '15px', padding: '10px', backgroundColor: '#0f172a', borderRadius: '6px' }}>
                    {retrievedCode.map(item => (
                      <div key={item.id} style={{ borderBottom: '1px solid #334155', paddingBottom: '5px', marginBottom: '5px' }}>
                        <p style={{ margin: 0, fontSize: '13px' }}>المنتج: {item.product_name}</p>
                        <p style={{ margin: '5px 0', color: '#22c55e', fontWeight: 'bold', fontSize: '16px' }}>الكود: {item.digital_code}</p>
                      </div>
                    ))}
                  </div>
                )}

                <button onClick={() => { setShowCheckCode(false); setRetrievedCode(null); }} style={{ width: '100%', backgroundColor: '#64748b', color: '#fff', border: 'none', padding: '8px', borderRadius: '6px', marginTop: '10px' }}>إلغاء</button>
              </div>
            </div>
          )}

          {/* نافذة البلاغات */}
          {showReport && (
            <div className="modal">
              <div className="modal-content">
                <h3 style={{ color: '#ef4444' }}>⚠️ تقديم بلاغ / شكوى</h3>
                <form onSubmit={handleReport}>
                  <label>رقم التواصل:</label>
                  <input required value={reportPhone} onChange={e => reportPhone} onInput={e => setReportPhone(e.target.value)} placeholder="09XXXXXXXX" />
                  <label>نص المشكلة:</label>
                  <textarea required value={reportMsg} onChange={e => setReportMsg(e.target.value)} placeholder="اكتب تفاصيل البلاغ..." style={{ height: '80px' }} />
                  <div style={{ display: 'flex', gap: '10px' }}>
                    <button type="submit" disabled={loading} style={{ flex: 1, backgroundColor: '#dc2626', color: '#fff', border: 'none', padding: '10px', borderRadius: '6px', fontWeight: 'bold' }}>إرسال البلاغ</button>
                    <button type="button" onClick={() => setShowReport(false)} style={{ backgroundColor: '#64748b', color: '#fff', border: 'none', padding: '10px', borderRadius: '6px' }}>إلغاء</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
