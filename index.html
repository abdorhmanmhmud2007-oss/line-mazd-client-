<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خط المجد لشحن الألعاب</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin: 0; background-color: #0f172a; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createClient } = supabase;

    const supabaseUrl = 'https://alphhjktqdoubsaxjrgm.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFscGhoamt0cWRvdWJzYXhqcmdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMzg2NjQsImV4cCI6MjA1NzgxNDY2NH0.p5c4wPqV6pE5g5Y8v3J3L4L6O0P8Q9R1S2T3U4V5W6X';
    const db = createClient(supabaseUrl, supabaseKey);

    function App() {
      const [products, setProducts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [errorMsg, setErrorMsg] = useState('');

      useEffect(() => {
        async function loadData() {
          const { data, error } = await db.from('products').select('*');
          if (error) {
            setErrorMsg(error.message);
          } else {
            setProducts(data || []);
          }
          setLoading(false);
        }
        loadData();
      }, []);

      return (
        <div style={{ padding: '15px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid #1e293b', paddingBottom: '15px' }}>
            <h2 style={{ margin: 0, fontSize: '18px' }}>خط المجد لشحن الألعاب</h2>
            <a href="https://wa.me/218913147002" target="_blank" style={{ backgroundColor: '#25D366', color: '#fff', padding: '8px 12px', borderRadius: '6px', textDecoration: 'none', fontWeight: 'bold', fontSize: '13px' }}>
              📱 واتساب الدعم
            </a>
          </div>

          <h3>العروض المتاحة</h3>

          {loading && <p style={{ color: '#38bdf8' }}>جاري تحميل العروض...</p>}
          {errorMsg && <p style={{ color: '#ef4444' }}>خطأ في الجلب: {errorMsg}</p>}

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(140px, 1fr))', gap: '10px' }}>
            {products.map(p => (
              <div key={p.id} style={{ backgroundColor: '#1e293b', padding: '10px', borderRadius: '8px', textAlign: 'center', border: '1px solid #334155' }}>
                <h4 style={{ margin: '5px 0', fontSize: '14px' }}>{p.name}</h4>
                <p style={{ color: '#38bdf8', margin: '5px 0', fontWeight: 'bold' }}>{p.in_stock ? `${p.price} د.ل` : 'قريباً'}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
