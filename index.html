<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر المجد للشحن السريع</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #10b981;
      --accent-hover: #059669;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      direction: rtl;
    }
    .container { max-width: 500px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 25px; margin-top: 10px; }
    header h1 { margin: 0; font-size: 24px; color: #fff; }
    
    /* قسم متابعة حالة الطلب بتصميم أنيق */
    .track-section {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 25px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .track-section h3 { margin: 0 0 12px 0; font-size: 16px; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .track-input-group { display: flex; gap: 8px; }
    .track-input-group input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 14px;
      outline: none;
    }
    .track-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0 16px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }
    
    /* نتائج البحث */
    .result-card {
      margin-top: 12px;
      padding: 12px;
      background: #0f172a;
      border-radius: 10px;
      border-right: 4px solid #3b82f6;
      font-size: 14px;
    }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .status-pending { background: #f59e0b; color: #000; }
    .status-completed { background: #10b981; color: #fff; }
    .status-rejected { background: #ef4444; color: #fff; }

    /* عنوان الألعاب */
    .section-title { font-size: 18px; margin-bottom: 15px; color: var(--text); }

    /* شبكة المنتجات */
    .products { display: flex; flex-direction: column; gap: 12px; }
    .product-card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .product-info h3 { margin: 0 0 4px 0; font-size: 16px; }
    .product-info p { margin: 0; color: var(--subtext); font-size: 14px; }
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    /* النافذة المنبثقة */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      align-items: center;
      justify-content: center;
      padding: 15px;
      z-index: 1000;
    }
    .modal-content {
      background: var(--card);
      padding: 20px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 6px; color: var(--subtext); font-size: 13px; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      box-sizing: border-box;
      font-size: 14px;
    }
    .btn-submit { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; }
    .btn-close { width: 100%; padding: 10px; background: #475569; color: white; border: none; border-radius: 8px; margin-top: 8px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>متجر الشحن السريع</h1>
  </header>

  <!-- متابعة الطلب -->
  <div class="track-section">
    <h3>🔍 متابعة حالة الطلب</h3>
    <div class="track-input-group">
      <input type="text" id="searchQuery" placeholder="أدخل رقم الهاتف أو الآيدي">
      <button class="track-btn" onclick="checkOrderStatus()">فحص</button>
    </div>
    <div id="statusResult"></div>
  </div>

  <div class="section-title">الألعاب والخدمات</div>
  <div class="products">
    <div class="product-card">
      <div class="product-info">
        <h3>Free Fire - 100 جوهرة</h3>
        <p>14 د.ل</p>
      </div>
      <button class="btn" onclick="openOrder('Free Fire - 100 جوهرة', 14)">شراء</button>
    </div>

    <div class="product-card">
      <div class="product-info">
        <h3>PUBG - 60 UC</h3>
        <p>6.5 د.ل</p>
      </div>
      <button class="btn" onclick="openOrder('PUBG - 60 UC', 6.5)">شراء</button>
    </div>
  </div>
</div>

<!-- نافذة الطلب المنبثقة -->
<div class="modal" id="orderModal">
  <div class="modal-content">
    <h3 id="modalTitle" style="margin-top:0;">شراء المنتج</h3>
    <div class="form-group">
      <label>ادخل آيدي الحساب (Player ID):</label>
      <input type="text" id="playerId" placeholder="مثال: 1928473929">
    </div>
    <div class="form-group">
      <label>طريقة الدفع:</label>
      <select id="paymentMethod" onchange="togglePaymentFields()">
        <option value="ليبيانا">تحويل رصيد ليبيانا (0944235295)</option>
        <option value="مدار">تحويل رصيد مدار (0944235295)</option>
        <option value="كروت">كروت تعبئة</option>
      </select>
    </div>
    <div class="form-group" id="phoneGroup">
      <label>رقم هاتف المرسل:</label>
      <input type="text" id="senderPhone" placeholder="09XXXXXXXX">
    </div>
    <div class="form-group" id="cardGroup" style="display:none;">
      <label>كود كرت التعبئة:</label>
      <input type="text" id="cardCode" placeholder="أدخل أرقام الكرت">
    </div>
    <div class="form-group">
      <label>صورة إثبات التحويل (اختياري):</label>
      <input type="file" id="receiptFile" accept="image/*">
    </div>
    <button class="btn-submit" id="submitBtn" onclick="submitOrder()">إرسال الطلب</button>
    <button class="btn-close" onclick="closeModal()">إلغاء</button>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://aomakujftptysdytlmnz.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvbWFrdWpmdHB0eXNkeXRsbW56Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMTcyNzQsImV4cCI6MjA1Njc5MzI3NH0.GToU7C6S2-6L0jC9N8mP-U_y10A9S7wS8zN6uL5M_kY";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let selectedProduct = '';
  let selectedPrice = 0;

  function togglePaymentFields() {
    const method = document.getElementById('paymentMethod').value;
    document.getElementById('cardGroup').style.display = (method === 'كروت') ? 'block' : 'none';
  }

  function openOrder(name, price) {
    selectedProduct = name;
    selectedPrice = price;
    document.getElementById('modalTitle').innerText = `شراء: ${name} (${price} د.ل)`;
    document.getElementById('orderModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('orderModal').style.display = 'none';
  }

  // فحص حالة الطلب
  async function checkOrderStatus() {
    const query = document.getElementById('searchQuery').value.trim();
    const resultDiv = document.getElementById('statusResult');
    if (!query) {
      resultDiv.innerHTML = '<p style="color:#ef4444; font-size:13px; margin-top:8px;">أدخل رقم الهاتف أو الآيدي.</p>';
      return;
    }

    resultDiv.innerHTML = '<p style="color:#94a3b8; font-size:13px; margin-top:8px;">جاري البحث...</p>';

    const { data, error } = await supabaseClient
      .from('orders')
      .select('*')
      .or(`sender_phone.eq.${query},player_id.eq.${query}`)
      .order('created_at', { ascending: false });

    if (error || !data || data.length === 0) {
      resultDiv.innerHTML = '<p style="color:#ef4444; font-size:13px; margin-top:8px;">لم نجد طلبات بهذا الرقم/الآيدي.</p>';
      return;
    }

    let html = '';
    data.forEach(order => {
      let statusBadge = '<span class="badge status-pending">قيد الانتظار ⏳</span>';
      if (order.status === 'completed') statusBadge = '<span class="badge status-completed">مكتمل ✅</span>';
      if (order.status === 'rejected') statusBadge = '<span class="badge status-rejected">مرفوض ❌</span>';

      html += `
        <div class="result-card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>${order.product_name}</strong>
            ${statusBadge}
          </div>
          <p style="margin:5px 0 0 0; font-size:12px; color:#94a3b8;">الآيدي: ${order.player_id}</p>
          ${order.digital_code ? `<p style="margin:8px 0 0 0; font-size:13px; color:#10b981;"><b>الكود:</b> <code style="background:#1e293b; padding:2px 6px; border-radius:4px;">${order.digital_code}</code></p>` : ''}
        </div>
      `;
    });

    resultDiv.innerHTML = html;
  }

  // إرسال الطلب
  async function submitOrder() {
    const playerId = document.getElementById('playerId').value.trim();
    const paymentMethod = document.getElementById('paymentMethod').value;
    const senderPhone = document.getElementById('senderPhone').value.trim();
    const cardCode = document.getElementById('cardCode').value.trim();
    const fileInput = document.getElementById('receiptFile');
    const submitBtn = document.getElementById('submitBtn');

    if (!playerId) { alert('يرجى إدخال آيدي الحساب'); return; }

    submitBtn.innerText = 'جاري الإرسال...';
    submitBtn.disabled = true;

    try {
      let receiptUrl = null;
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const fileName = `${Date.now()}_${file.name}`;
        const { data: uploadData, error: uploadError } = await supabaseClient.storage
          .from('receipts')
          .upload(fileName, file);

        if (!uploadError) {
          const { data: urlData } = supabaseClient.storage.from('receipts').getPublicUrl(fileName);
          receiptUrl = urlData.publicUrl;
        }
      }

      const { error } = await supabaseClient.from('orders').insert([{
        product_name: selectedProduct,
        price: selectedPrice,
        player_id: playerId,
        payment_method: paymentMethod,
        sender_phone: senderPhone,
        card_code: cardCode,
        receipt_url: receiptUrl,
        status: 'pending'
      }]);

      if (error) throw error;

      alert('تم إرسال طلبك بنجاح! يمكنك الاستعلام عنه من أعلى الصفحة.');
      closeModal();
    } catch (err) {
      alert('حدث خطأ في الإرسال: ' + err.message);
    } finally {
      submitBtn.innerText = 'إرسال الطلب';
      submitBtn.disabled = false;
    }
  }
</script>
</body>
</html>
