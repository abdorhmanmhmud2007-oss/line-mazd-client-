<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خط المجد لشحن الألعاب</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin: 0; background-color: #0f172a; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createClient } = supabase;

    const supabaseUrl = 'https://alphhjktqdoubsaxjrgm.supabase.co';
    const supabaseKey = 'sb_publishable_Yyzx9XadPI-ucUkpppQNEg_PGGWqWxx';
    const db = createClient(supabaseUrl, supabaseKey);

    function App() {
      const [products, setProducts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [errorMsg, setErrorMsg] = useState('');

      useEffect(() => {
        async function fetchProducts() {
          try {
            const { data, error } = await db.from('products').select('*');
            if (error) throw error;
            setProducts(data || []);
          } catch (err) {
            setErrorMsg(err.message);
          } finally {
            setLoading(false);
          }
        }
        fetchProducts();
      }, []);

      return (
        <div style={{ padding: '15px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid #1e293b', paddingBottom: '15px' }}>
            <h2 style={{ margin: 0, fontSize: '18px' }}>خط المجد لشحن الألعاب</h2>
            <a href="https://wa.me/218913147002" target="_blank" style={{ backgroundColor: '#25D366', color: '#fff', padding: '8px 12px', borderRadius: '6px', textDecoration: 'none', fontWeight: 'bold', fontSize: '13px' }}>
              📱 واتساب الدعم
            </a>
          </div>

          <h3 style={{ marginTop: '20px' }}>العروض المتاحة</h3>

          {loading && <p style={{ color: '#38bdf8' }}>جاري جلب العروض...</p>}
          {errorMsg && <p style={{ color: '#ef4444' }}>حدث خطأ: {errorMsg}</p>}

          {!loading && !errorMsg && products.length === 0 && (
            <p style={{ color: '#94a3b8' }}>لا توجد عروض حالياً في قاعدة البيانات.</p>
          )}

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(140px, 1fr))', gap: '10px' }}>
            {products.map(p => (
              <div key={p.id} style={{ backgroundColor: '#1e293b', padding: '12px', borderRadius: '8px', textAlign: 'center', border: '1px solid #334155' }}>
                <h4 style={{ margin: '5px 0', fontSize: '14px' }}>{p.name}</h4>
                <p style={{ color: '#38bdf8', margin: '5px 0', fontWeight: 'bold' }}>{p.price} د.ل</p>
                <button style={{ backgroundColor: '#2563eb', color: '#fff', border: 'none', width: '100%', padding: '6px', borderRadius: '4px', cursor: 'pointer', fontWeight: 'bold', marginTop: '5px' }}>
                  شحن الآن
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
