<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خط المجد لشحن الألعاب</title>
  <!-- مكتبة React و Supabase مباشرة -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin: 0; background-color: #0f172a; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createClient } = supabase;

    const supabaseUrl = 'https://alphhjktqdoubsaxjrgm.supabase.co';
    const supabaseKey = 'YOUR_SUPABASE_ANON_KEY'; // اتركها أو ضع المفتاح إن وجد
    const db = createClient(supabaseUrl, supabaseKey);

    function App() {
      const [products, setProducts] = useState([]);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [paymentMethod, setPaymentMethod] = useState('transfer');
      const [playerId, setPlayerId] = useState('');
      const [senderPhone, setSenderPhone] = useState('');
      const [cardCode, setCardCode] = useState('');
      const [cardCount, setCardCount] = useState(1);
      const [showReport, setShowReport] = useState(false);
      const [reportPhone, setReportPhone] = useState('');
      const [reportMsg, setReportMsg] = useState('');
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        db.from('products').select('*').then(({ data, error }) => {
          if (!error && data) setProducts(data);
        });
      }, []);

      async function handleOrder(e) {
        e.preventDefault();
        setLoading(true);
        let order = {
          product_name: selectedProduct.name,
          price: selectedProduct.price,
          player_id: playerId,
          payment_method: paymentMethod === 'transfer' ? 'تحويل رصيد' : 'كروت شحن',
          status: 'pending'
        };
        if (paymentMethod === 'transfer') order.sender_phone = senderPhone;
        else { order.card_code = cardCode; order.card_count = cardCount; }

        const { error } = await db.from('orders').insert([order]);
        setLoading(false);
        if (error) alert('حدث خطأ أثناء إرسال الطلب');
        else {
          alert('تم إرسال طلبك بنجاح!');
          setSelectedProduct(null);
        }
      }

      async function handleReport(e) {
        e.preventDefault();
        setLoading(true);
        const { error } = await db.from('reports').insert([{ user_phone: reportPhone, message: reportMsg }]);
        setLoading(false);
        if (error) alert('حدث خطأ أثناء إرسال البلاغ');
        else {
          alert('تم إرسال البلاغ للإدارة بنجاح');
          setShowReport(false);
        }
      }

      return (
        <div style={{ padding: '15px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid #1e293b', paddingBottom: '15px' }}>
            <h2 style={{ margin: 0, fontSize: '18px' }}>خط المجد لشحن الألعاب</h2>
            <a href="https://wa.me/218913147002" target="_blank" style={{ backgroundColor: '#25D366', color: '#fff', padding: '8px 12px', borderRadius: '6px', textDecoration: 'none', fontWeight: 'bold', fontSize: '13px' }}>
              📱 واتساب الدعم
            </a>
          </div>

          <h3>العروض المتاحة</h3>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(150px, 1fr))', gap: '10px' }}>
            {products.map(p => (
              <div key={p.id} style={{ backgroundColor: '#1e293b', padding: '10px', borderRadius: '8px', textAlign: 'center' }}>
                <h4 style={{ margin: '5px 0' }}>{p.name}</h4>
                <p style={{ color: '#38bdf8', margin: '5px 0', fontWeight: 'bold' }}>{p.in_stock ? `${p.price} د.ل` : 'قريباً'}</p>
                {p.in_stock && (
                  <button onClick={() => setSelectedProduct(p)} style={{ backgroundColor: '#2563eb', color: '#fff', border: 'none', width: '100%', padding: '6px', borderRadius: '4px', cursor: 'pointer' }}>
                    شحن الآن
                  </button>
                )}
              </div>
            ))}
          </div>

          <div style={{ marginTop: '30px', textAlign: 'center' }}>
            <button onClick={() => setShowReport(true)} style={{ backgroundColor: '#dc2626', color: '#fff', border: 'none', padding: '8px 16px', borderRadius: '6px' }}>
              ⚠️ تقديم بلاغ / شكوى
            </button>
          </div>

          {selectedProduct && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.8)', display: 'flex', justifyContent: 'center', alignItems: 'center', padding: '15px' }}>
              <div style={{ backgroundColor: '#1e293b', padding: '20px', borderRadius: '10px', width: '100%', maxWidth: '350px' }}>
                <h3>شحن: {selectedProduct.name}</h3>
                <form onSubmit={handleOrder}>
                  <label>Player ID:</label>
                  <input required value={playerId} onChange={e => setPlayerId(e.target.value)} style={{ width: '100%', padding: '8px', margin: '5px 0 10px', boxSizing: 'border-box' }} />
                  <label>طريقة الدفع:</label>
                  <select value={paymentMethod} onChange={e => setPaymentMethod(e.target.value)} style={{ width: '100%', padding: '8px', margin: '5px 0 10px', boxSizing: 'border-box' }}>
                    <option value="transfer">تحويل رصيد (0944235295)</option>
                    <option value="card">كتابة كروت</option>
                  </select>

                  {paymentMethod === 'transfer' ? (
                    <div>
                      <label>رقمك المحول منه:</label>
                      <input required value={senderPhone} onChange={e => setSenderPhone(e.target.value)} style={{ width: '100%', padding: '8px', margin: '5px 0 10px', boxSizing: 'border-box' }} />
                    </div>
                  ) : (
                    <div>
                      <label>أرقام الكرت:</label>
                      <textarea required value={cardCode} onChange={e => setCardCode(e.target.value)} style={{ width: '100%', padding: '8px', margin: '5px 0 10px', boxSizing: 'border-box' }} />
                    </div>
                  )}

                  <div style={{ display: 'flex', gap: '10px', marginTop: '10px' }}>
                    <button type="submit" disabled={loading} style={{ flex: 1, backgroundColor: '#16a34a', color: '#fff', border: 'none', padding: '8px', borderRadius: '4px' }}>تأكيد</button>
                    <button type="button" onClick={() => setSelectedProduct(null)} style={{ backgroundColor: '#64748b', color: '#fff', border: 'none', padding: '8px', borderRadius: '4px' }}>إلغاء</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {showReport && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.8)', display: 'flex', justifyContent: 'center', alignItems: 'center', padding: '15px' }}>
              <div style={{ backgroundColor: '#1e293b', padding: '20px', borderRadius: '10px', width: '100%', maxWidth: '350px' }}>
                <h3 style={{ color: '#ef4444' }}>تقديم بلاغ</h3>
                <form onSubmit={handleReport}>
                  <label>رقم الهاتف:</label>
                  <input value={reportPhone} onChange={e => setReportPhone(e.target.value)} style={{ width: '100%', padding: '8px', margin: '5px 0 10px', boxSizing: 'border-box' }} />
                  <label>التفاصيل:</label>
                  <textarea required value={reportMsg} onChange={e => setReportMsg(e.target.value)} style={{ width: '100%', padding: '8px', margin: '5px 0 10px', boxSizing: 'border-box' }} />
                  <div style={{ display: 'flex', gap: '10px' }}>
                    <button type="submit" disabled={loading} style={{ flex: 1, backgroundColor: '#dc2626', color: '#fff', border: 'none', padding: '8px', borderRadius: '4px' }}>إرسال</button>
                    <button type="button" onClick={() => setShowReport(false)} style={{ backgroundColor: '#64748b', color: '#fff', border: 'none', padding: '8px', borderRadius: '4px' }}>إلغاء</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
