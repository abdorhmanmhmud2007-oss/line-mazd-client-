      const [loading, setLoading] = useState(false);

      useEffect(() => {
        db.from('visitors').insert([{ user_agent: navigator.userAgent }]).then(() => {});

        async function fetchProducts() {
          const { data } = await db.from('products').select('*');
          if (data) setProducts(data);
        }
        fetchProducts();
      }, []);

      async function uploadImage(file) {
        if (!file) return null;
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}.${fileExt}`;
        const { data, error } = await db.storage.from('receipts').upload(fileName, file);
        if (error) return null;
        const { data: publicUrlData } = db.storage.from('receipts').getPublicUrl(fileName);
        return publicUrlData.publicUrl;
      }

      async function handleOrder(e) {
        e.preventDefault();
        setLoading(true);

        let imgUrl = null;
        if (imageFile) {
          imgUrl = await uploadImage(imageFile);
        }

        let isCodeService = ['itunes', 'usdt', 'roblox', 'razer'].includes(selectedGame);

          price: selectedOffer.price,
          player_id: isCodeService ? `${GAMES.find(g => g.id === selectedGame)?.name} (تسليم كود)` : playerId,
          payment_method: paymentMethod === 'transfer' ? 'تحويل رصيد ليبيانا' : 'كتابة الكرت',
          receipt_url: imgUrl,
          status: 'pending',
          sender_phone: senderPhone,
          card_code: paymentMethod === 'card' ? cardCode : null
        };
